name: Build APK Raje Kampong

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Platform & Configure Firebase
        run: |
          flutter create --org id.go.beltim.dprd --project-name raje_kampong --platforms=android .
          cp google-services.json android/app/google-services.json

          # Naikkan versi Kotlin & tambahkan plugin google-services di settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "2.1.0" apply false/' android/settings.gradle
          sed -i 's/id "com.android.application" version ".*" apply false/&\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle

          # Terapkan plugin google-services, coreLibraryDesugaring, dan minSdk 23 di android/app/build.gradle
          sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
          echo -e "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}" >> android/app/build.gradle

          # Tambahkan izin notifikasi Android 13+ di AndroidManifest.xml
          sed -i 's/<uses-permission android:name="android.permission.INTERNET"\/>/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>/' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raje-kampong-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
