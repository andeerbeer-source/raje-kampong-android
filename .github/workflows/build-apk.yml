name: Build APK Raje Kampong

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      # Keep the Android debug signing key stable between workflow runs.
      # This prevents INSTALL_FAILED_UPDATE_INCOMPATIBLE when installing
      # a new APK over an earlier APK built by this repository.
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: raje-kampong-android-signing-v1

      - name: Generate Android Platform & Configure Firebase
        shell: bash
        run: |
          set -euo pipefail
          flutter create --org id.go.beltim.dprd --project-name raje_kampong --platforms=android .
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version ".*" apply false/&\n    id("com.google.gms.google-services") version "4.4.2" apply false/' android/settings.gradle.kts
            sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
            cat >> android/app/build.gradle.kts <<'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          else
            sed -i 's/id "com.android.application" version ".*" apply false/&\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
            sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
            cat >> android/app/build.gradle <<'EOF'

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          EOF
          fi

          # Keep the Android namespace aligned with Flutter's generated MainActivity
          # package, while using the Firebase-registered applicationId.
          python3 - <<'PY'
          from pathlib import Path
          import re

          kotlin_files = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if not kotlin_files:
              raise SystemExit("MainActivity.kt tidak ditemukan setelah flutter create")
          source = kotlin_files[0].read_text(encoding="utf-8")
          match = re.search(r"^\s*package\s+([A-Za-z0-9_.]+)", source, re.MULTILINE)
          if not match:
              raise SystemExit("Deklarasi package MainActivity tidak ditemukan")
          activity_package = match.group(1)
          target_app_id = "id.go.beltim.dprd.rajekampong"

          gradle_files = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in gradle_files if p.exists()), None)
          if gradle is None:
              raise SystemExit("File Gradle aplikasi tidak ditemukan")
          text = gradle.read_text(encoding="utf-8")

          if re.search(r'namespace\s*=\s*"[^"]+"', text):
              text = re.sub(r'namespace\s*=\s*"[^"]+"',
                            f'namespace = "{activity_package}"', text, count=1)
          elif re.search(r'namespace\s+"[^"]+"', text):
              text = re.sub(r'namespace\s+"[^"]+"',
                            f'namespace "{activity_package}"', text, count=1)
          else:
              raise SystemExit("Deklarasi namespace Gradle tidak ditemukan")

          if re.search(r'applicationId\s*=\s*"[^"]+"', text):
              text = re.sub(r'applicationId\s*=\s*"[^"]+"',
                            f'applicationId = "{target_app_id}"', text, count=1)
          elif re.search(r'applicationId\s+"[^"]+"', text):
              text = re.sub(r'applicationId\s+"[^"]+"',
                            f'applicationId "{target_app_id}"', text, count=1)
          else:
              raise SystemExit("Deklarasi applicationId Gradle tidak ditemukan")

          gradle.write_text(text, encoding="utf-8")
          print(f"namespace={activity_package}")
          print(f"applicationId={target_app_id}")
          PY

          # Add required permissions and FCM channel robustly to generated manifest.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text(encoding="utf-8")
          nl = chr(10)

          for permission in (
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
          ):
              if permission not in xml:
                  pos = xml.find("<application")
                  if pos < 0:
                      raise SystemExit("Tag application tidak ditemukan di AndroidManifest.xml")
                  xml = xml[:pos] + f'<uses-permission android:name="{permission}" />' + nl + "    " + xml[pos:]

          if "firebase.messaging.default_notification_channel_id" not in xml:
              metadata = ('    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" '
                          'android:value="raje_kampong_channel" />')
              xml = xml.replace("</application>", metadata + nl + "    </application>", 1)

          path.write_text(xml, encoding="utf-8")
          print("AndroidManifest.xml berhasil diperbarui")
          PY
          
                              echo "=== Android applicationId / namespace / MainActivity ==="
          grep -n 'applicationId\|namespace\|minSdk' android/app/build.gradle* || true
          grep -R -n '^package ' android/app/src/main/kotlin
          echo "=== Firebase package configuration ==="
          grep -n 'package_name' android/app/google-services.json
          grep -q 'android.intent.action.MAIN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies & Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          flutter build apk --release --no-shrink
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK package, minimum Android version, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "=== APK metadata ==="
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          echo "=== APK signature verification ==="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "=== APK size and SHA256 ==="
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Install APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -e
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            APP_ID="id.go.beltim.dprd.rajekampong"
            ACTIVITY_FILE="$(find android/app/src/main -type f \\( -name 'MainActivity.kt' -o -name 'MainActivity.java' \\) -print -quit)"
            if [ -z "$ACTIVITY_FILE" ]; then
              echo "MainActivity.kt/java tidak ditemukan:"
              find android/app/src/main -maxdepth 8 -type f -print
              exit 1
            fi
            ACTIVITY_PACKAGE="$(sed -nE 's/^[[:space:]]*package[[:space:]]+([^;[:space:]]+).*/\\1/p' "$ACTIVITY_FILE" | head -n 1)"
            if [ -z "$ACTIVITY_PACKAGE" ]; then
              echo "Package MainActivity tidak ditemukan dalam $ACTIVITY_FILE"
              cat "$ACTIVITY_FILE"
              exit 1
            fi
            echo "Activity source: $ACTIVITY_FILE"
            echo "Launching $APP_ID/$ACTIVITY_PACKAGE.MainActivity"
            adb logcat -c
            START_OUTPUT="$(adb shell am start -W -n "$APP_ID/$ACTIVITY_PACKAGE.MainActivity" 2>&1)" || {
              echo "$START_OUTPUT"
              adb shell dumpsys package "$APP_ID" | grep -A8 -B3 -E 'MainActivity|LAUNCHER' || true
              exit 1
            }
            echo "$START_OUTPUT"
            echo "$START_OUTPUT" | grep -q "Status: ok"
            sleep 8
            if adb logcat -d -s AndroidRuntime:E | grep -E "FATAL EXCEPTION|ClassNotFoundException|Unable to instantiate activity|Process: $APP_ID" ; then
              echo "Aplikasi crash saat launcher dijalankan"
              exit 1
            fi
            echo "Launcher test passed: aplikasi berhasil dibuka di emulator."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raje-kampong-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
