name: Build APK Raje Kampong

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Generate Android Platform & Configure Firebase
        run: |
          flutter create --org id.go.beltim.dprd --project-name raje_kampong --platforms=android .
          cp google-services.json android/app/google-services.json

          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id.go.beltim.dprd.raje_kampong/id.go.beltim.dprd.rajekampong/g' android/app/build.gradle.kts
            sed -i 's/id("com.android.application") version ".*" apply false/&\n    id("com.google.gms.google-services") version "4.4.2" apply false/' android/settings.gradle.kts
            sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
            echo -e "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}" >> android/app/build.gradle.kts
          else
            sed -i 's/id.go.beltim.dprd.raje_kampong/id.go.beltim.dprd.rajekampong/g' android/app/build.gradle
            sed -i 's/id "com.android.application" version ".*" apply false/&\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
            sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
            echo -e "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}" >> android/app/build.gradle
          fi

          # Tambahkan izin notifikasi Android 13+ dan channel default FCM di AndroidManifest.xml
          sed -i 's/<uses-permission android:name="android.permission.INTERNET"\/>/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="raje_kampong_channel" \/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raje-kampong-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
